<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>StockMonkey</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --green: #3fb950;
    --green-bg: rgba(63,185,80,0.1);
    --red: #f85149;
    --red-bg: rgba(248,81,73,0.1);
    --accent: #58a6ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 3rem 0;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 2rem 1.25rem 1rem;
    text-align: center;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header h1 span { color: var(--accent); }

  .meta {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-top: 0.4rem;
  }

  .summary-bar {
    display: flex;
    gap: 0.75rem;
    padding: 0 1.25rem;
    margin-bottom: 1rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .summary-bar::-webkit-scrollbar { display: none; }

  .summary-pill {
    flex-shrink: 0;
    padding: 0.4rem 0.85rem;
    border-radius: 2rem;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .summary-pill.up { background: var(--green-bg); color: var(--green); }
  .summary-pill.down { background: var(--red-bg); color: var(--red); }
  .summary-pill.flat { background: rgba(139,148,158,0.12); color: var(--text-muted); }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 0 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { background: var(--surface-hover); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
  }

  .ticker-name {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .card-right {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .pct {
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    border-radius: 0.35rem;
  }
  .pct.up { background: var(--green-bg); color: var(--green); }
  .pct.down { background: var(--red-bg); color: var(--red); }
  .pct.flat { background: rgba(139,148,158,0.12); color: var(--text-muted); }

  .chevron {
    width: 1rem;
    height: 1rem;
    transition: transform 0.25s ease;
    color: var(--text-muted);
  }
  .card.open .chevron { transform: rotate(180deg); }

  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, padding 0.25s ease;
    padding: 0 1.25rem;
  }
  .card.open .card-body {
    max-height: 32rem;
    padding: 0 1.25rem 1.25rem;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .detail-item {
    background: var(--bg);
    border-radius: 0.5rem;
    padding: 0.75rem;
  }

  .detail-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
  }

  .detail-value {
    font-size: 1.1rem;
    font-weight: 700;
  }
  .detail-value.up { color: var(--green); }
  .detail-value.down { color: var(--red); }
  .detail-value.flat { color: var(--text-muted); }

  .summary-text {
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }

  .error-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }
  .error-state h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text); }

  .loading {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1><span>StockMonkey</span></h1>
  <div class="meta" id="meta">Loading...</div>
</header>

<div class="summary-bar" id="summaryBar"></div>
<div class="cards" id="cards">
  <div class="loading">Loading stock data...</div>
</div>

<script>
const DATA_URL = 'data/latest.json';

function direction(pct) {
  if (pct > 0) return 'up';
  if (pct < 0) return 'down';
  return 'flat';
}

function arrow(dir) {
  if (dir === 'up') return '▲';
  if (dir === 'down') return '▼';
  return '—';
}

function formatPct(pct) {
  const sign = pct > 0 ? '+' : '';
  return sign + pct.toFixed(2) + '%';
}

function formatPrice(p) {
  return '$' + p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatChange(c) {
  const sign = c > 0 ? '+' : '';
  return sign + c.toFixed(2);
}

function timeAgo(iso) {
  const d = new Date(iso);
  const now = new Date();
  const mins = Math.floor((now - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + 'd ago';
}

function renderCard(stock) {
  const dir = direction(stock.percent_change);
  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="card-header">
      <span class="ticker-name">${stock.ticker}</span>
      <div class="card-right">
        <span class="pct ${dir}">${arrow(dir)} ${formatPct(stock.percent_change)}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
    <div class="card-body">
      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-label">Price</div>
          <div class="detail-value">${formatPrice(stock.price)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Change</div>
          <div class="detail-value ${dir}">${arrow(dir)} ${formatChange(stock.change)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">% Change</div>
          <div class="detail-value ${dir}">${formatPct(stock.percent_change)}</div>
        </div>
      </div>
      ${stock.summary ? `<div class="summary-text">${stock.summary}</div>` : ''}
    </div>
  `;

  card.querySelector('.card-header').addEventListener('click', () => {
    card.classList.toggle('open');
  });

  return card;
}

async function init() {
  const cardsEl = document.getElementById('cards');
  const metaEl = document.getElementById('meta');
  const barEl = document.getElementById('summaryBar');

  try {
    const resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error('No data yet');
    const data = await resp.json();

    metaEl.textContent = `Updated ${timeAgo(data.generated_at)} · ${data.stocks.length} stocks`;

    barEl.innerHTML = '';
    data.stocks.forEach(s => {
      const dir = direction(s.percent_change);
      const pill = document.createElement('span');
      pill.className = `summary-pill ${dir}`;
      pill.textContent = `${s.ticker} ${arrow(dir)} ${formatPct(s.percent_change)}`;
      barEl.appendChild(pill);
    });

    cardsEl.innerHTML = '';
    data.stocks.forEach(s => {
      cardsEl.appendChild(renderCard(s));
    });
  } catch (e) {
    cardsEl.innerHTML = `
      <div class="error-state">
        <h2>No data available</h2>
        <p>The daily brief hasn't run yet today. Check back after market open.</p>
      </div>
    `;
    metaEl.textContent = 'Waiting for data...';
  }
}

init();
</script>
</body>
</html>
